#  The authoritative Linux x86-64 gate.
#
#  ROADMAP.md R0.70 makes native Linux x86-64 the authority for Linux
#  behaviour, and the local Apple Container loop the convenience.  This
#  manifest is that authority: builds.sr.ht runs it on real x86-64 hardware,
#  with no translation between the compiler and the instruction set.
#
#  The pinned toolchain comes from environments/pins.sh, the same file the
#  container recipe reads, and every archive is checksum-verified before it
#  is unpacked.
#
#  It also publishes the reading copies, last and only from main.  That is a
#  convenience and not part of the gate's authority: it produces no evidence,
#  and it runs only after every check above has passed, so a red gate cannot
#  put a page up.

image: debian/stable

packages:
  - binutils
  - ca-certificates
  - curl
  #  hut publishes the reading copies; see the pages task.
  - hut
  - libc6-dev
  - python3

#  A token for one thing, generated for this job and gone with it: hut may
#  replace the contents of the pages site and nothing else.
oauth: pages.sr.ht/PAGES:RW

environment:
  LANDIN_TOOLCHAINS: /home/build/toolchains
  LANDIN_BUILD_TAG: srht-x86-64

tasks:
  #  Recorded first, so a captured log names the compiler that produced it.
  - toolchain: |
      cd landin
      . ./environments/pins.sh
      landin_install_toolchain "$LANDIN_TOOLCHAINS" x86_64-linux
      echo "LANDIN_GNAT_HOME=$LANDIN_TOOLCHAINS/gnat-$LANDIN_GNAT_VERSION" \
        >> ~/.buildenv
      echo "LANDIN_GPRBUILD_HOME=$LANDIN_TOOLCHAINS/gprbuild-$LANDIN_GPRBUILD_VERSION" \
        >> ~/.buildenv
      echo "export LANDIN_GNAT_HOME LANDIN_GPRBUILD_HOME" >> ~/.buildenv

  - identify: |
      cd landin
      uname -a
      ./scripts/toolchain.sh

  #  From clean, because a gate that reports on somebody else's objects is
  #  not a gate.
  - build: |
      cd landin
      ./scripts/clean.sh --all
      ./scripts/build.sh

  - test: |
      cd landin
      ./scripts/test.sh

  #  Release drops the assertions, so a rule that only holds with -gnata
  #  shows up here rather than in a later surprise.
  - release: |
      cd landin
      LANDIN_BUILD_MODE=release ./scripts/test.sh

  - checks: |
      cd landin
      python3 check.py

  #  The chassis must still refuse to claim a version.
  - identity: |
      cd landin
      ./compiler/ada/build/srht-x86-64/debug/bin/refine --identify

  #  Render, verify and publish https://sinnfrei.srht.site.  The pages used
  #  to move only when somebody remembered to run scripts/site.sh --publish,
  #  which is how documentation and its reading copy drift apart.
  #
  #  Only from main, so a branch cannot replace the published site, and so a
  #  build submitted without secrets -- a mailed patch has none, and hut
  #  would have no token -- never reaches this task at all.
  - pages: |
      cd landin
      if [ "${GIT_REF:-}" != "refs/heads/main" ]; then
          echo "landin: ${GIT_REF:-no ref} is not main; not publishing"
          exit 0
      fi
      ./scripts/site.sh --publish
