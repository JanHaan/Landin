#  Installing the pinned toolchain, in one place.
#
#  environments/pins.sh is the one place a version or a checksum is written,
#  and this is the one place a workflow reads it, so a job cannot quietly
#  acquire a different compiler.  It also identifies what it installed:
#  the target driver comes from the pin rather than from the runner, since
#  the FSF build installs itself as x86_64-pc-linux-gnu-gcc, or as
#  aarch64-linux-gnu-gcc on arm64, and Ubuntu's own gcc answers to a
#  different triplet.

name: Pinned toolchain
description: Install the pinned GNAT and GPRbuild, and say which ones.

inputs:
  platform:
    description: >-
      A platform environments/pins.sh carries a checksum for: x86_64-linux,
      aarch64-linux or aarch64-darwin.
    required: false
    default: x86_64-linux

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        # configure-apt-sources.sh prioritizes Azure in this mirror list.
        # Observed package downloads took 42 seconds or over 15 minutes;
        # retain the image's canonical archive/security routes and signing.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/scripts/build/configure-apt-sources.sh
        if test -f /etc/apt/apt-mirrors.txt; then
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
        fi
    - shell: bash
      run: |
        set -eu
        . ./environments/pins.sh
        landin_install_toolchain "$HOME/landin-toolchain" '${{ inputs.platform }}'
        {
          echo "LANDIN_GNAT_HOME=$HOME/landin-toolchain/gnat-$LANDIN_GNAT_VERSION"
          echo "LANDIN_GPRBUILD_HOME=$HOME/landin-toolchain/gprbuild-$LANDIN_GPRBUILD_VERSION"
        } >> "$GITHUB_ENV"
    - shell: bash
      run: |
        # Drain version output: an early reader exit can make GNAT report
        # "disk full" for a broken pipe when SIGPIPE is ignored by its host.
        "$LANDIN_GNAT_HOME/bin/gnat" --version | sed -n '1p'
        "$LANDIN_GPRBUILD_HOME/bin/gprbuild" --version | sed -n '1p'
