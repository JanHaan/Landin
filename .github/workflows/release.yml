#  Publish `refine` for the platforms the pins carry a checksum for.
#
#  A consuming project should not have to build a compiler to use one, and
#  should not have to fetch a 383 MB toolchain to get a 20 MB program. The
#  flake's source build stays what it is; this is the fast path beside it.
#
#  Assets are named and hashed the way environments/pins.sh names and
#  hashes the toolchain it fetches, because that is the pattern this
#  repository already trusts: fetch a prebuilt archive, verify it against
#  a recorded sha256, refuse on mismatch.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish assets for.
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x86_64-linux
            build: linux-amd64
          - runner: macos-15
            platform: aarch64-darwin
            build: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      #  Inlined rather than using .github/actions/pinned-toolchain, which
      #  the other workflows share. This one checks out a TAG, and a tag
      #  older than the action does not contain it -- v0.2.0 does not, and
      #  the first attempt failed on exactly that. environments/pins.sh has
      #  been there far longer, so reading it directly is what lets this
      #  build a release from a tree that predates the infrastructure.
      - name: Install the pinned toolchain
        run: |
          set -eu
          . ./environments/pins.sh
          landin_install_toolchain "$HOME/landin-toolchain" '${{ matrix.platform }}'
          {
            echo "LANDIN_GNAT_HOME=$HOME/landin-toolchain/gnat-$LANDIN_GNAT_VERSION"
            echo "LANDIN_GPRBUILD_HOME=$HOME/landin-toolchain/gprbuild-$LANDIN_GPRBUILD_VERSION"
          } >> "$GITHUB_ENV"
          "$HOME/landin-toolchain/gnat-$LANDIN_GNAT_VERSION/bin/gnat" --version | head -1

      #  Release mode: a consumer wants the compiler, not its assertions.
      - name: Build refine
        env:
          LANDIN_BUILD_MODE: release
        run: ./scripts/build.sh -j4

      - name: Package it
        id: package
        env:
          LANDIN_BUILD_MODE: release
        run: |
          set -eu
          version=$(sed -n 's/.*specification \([0-9][0-9.]*\)\..*/\1/p' README.md | head -1)
          asset="landin-$version-${{ matrix.platform }}.tar.gz"
          binary="compiler/ada/build/${{ matrix.build }}/release/bin/refine"
          test -x "$binary"
          #  Portable across GNU tar and the bsdtar macOS ships, which
          #  has no --sort, no --mtime and no --owner. The first attempt
          #  used all three and built on Linux while failing on Darwin.
          #  One file needs no sorting; a fixed mtime and gzip -n remove
          #  the two timestamps that would otherwise differ per run.
          stage=$(mktemp -d)
          cp "$binary" "$stage/refine"
          touch -t 197001010000 "$stage/refine"
          tar -cf - -C "$stage" refine | gzip -n -9 > "$asset"
          sum=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          echo "$sum  $asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum"  >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$sum" "$asset" > "$asset.sha256"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true

      #  The checksums go in the log as well as beside the assets, because
      #  the flake records them by hand and this is where they are read.
      - name: What was built
        run: |
          cd assets && ls -l && cat ./*.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag='${{ inputs.tag || github.ref_name }}'
          notes="The refine compiler, built from $tag by the release"
          notes="$notes workflow. Verify each asset against the .sha256"
          notes="$notes published beside it."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag \
              --title "Landin $tag" --notes "$notes"
          fi
          gh release upload "$tag" assets/* --clobber
