# Early physical-hardware feasibility, independent of backend completion.
name: RV64 hardware diagnostic
on:
  push:
    branches: [r11-40]
    paths:
      - .github/workflows/rv64-diagnostic.yml
      - scripts/rv64/diagnostic.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardware:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native GDB if absent
        run: |
          if ! command -v gdb; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
      - name: Check native tools, GDB and a nondefault extension
        run: python3 scripts/rv64/diagnostic.py
      - name: Retain physical runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rv64-diagnostic
          path: rv64-diagnostic/
          if-no-files-found: error
          retention-days: 14
