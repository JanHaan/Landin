#  The minimal gate: does the compiler still build, and does the corpus
#  still pass?
#
#  Until this existed nothing verified anything about the compiler on a
#  push. `determinism.yml` emits assembly and hashes it but never
#  assembles, links or runs; `pages.yml` publishes; `links.yml` checks
#  URLs. check.py -- the grammar, the transcription tables, the citations,
#  the document graph -- ran only when somebody typed it.
#
#  That gap mattered most for the work queued behind it. Rewriting spec.md
#  and tour.md means showing the rewritten documents describe the same
#  language, and the things that show it are check.py's grammar corpus and
#  the fixture suite. A safety net nobody runs is not one.
#
#  This is deliberately small. It is not the replacement for the retired
#  exact-revision acceptance: no Darwin, no Cortex-M execution, no
#  debugger, no bindings, no release-mode corpus, no evidence retained. It
#  builds the compiler on Linux, runs the two things that fail loudly when
#  the language moves, and holds the compiler to its scaling bound.
#  ROADMAP.md schedules the rest.
#
#  Two jobs, because the first measurement was lopsided: check.py takes a
#  minute and the 743-case corpus takes the rest of the hour. Waiting an
#  hour for a verdict on a typo is how a gate stops being read.
#
#  They share nothing, which is the point. check.py needs neither the
#  pinned toolchain nor a built compiler -- it reads documents, the grammar
#  and the transcription tables -- so `documents` installs nothing and
#  waits for nothing, and the compiler is built exactly once, in the job
#  that uses it. A compile error still surfaces about two minutes into
#  `compiler`, because the build is its first real step.
#
#  A third job, `scaling`, builds the release compiler and runs the
#  scaling benchmark.  It shares nothing with the other two
#  either, and a ratio it measures does not depend on the runner's speed.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #  Documents, grammar and the transcription tables. Nothing to install
  #  and nothing to build, so this is the fastest verdict available and it
  #  cannot be held up by the compiler.
  #
  #  The licensed face is not fetched: check_fonts reports its coverage as
  #  not checked rather than failing, and pages.yml refuses to publish
  #  without it, so the coverage stays enforced where it matters and this
  #  job stays independent of the object storage.
  documents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check.py
        run: python3 check.py

  #  The compiler and all 747 cases. scripts/test.sh builds first, so this
  #  is also where a compile error is reported.
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      #  The corpus is 2,494 compile-assemble-link-execute cycles over 544
      #  runtime and ABI fixtures at four or six profiles each, plus 268
      #  emissions. Two cases hold all of it, and they now run across
      #  workers. Measured on this runner, one job at a time: 4523s at
      #  one, 1801s at two, 2221s at four, and a timeout at eight. Two is
      #  the width, not four: each work item is itself a chain of
      #  processes, so four workers oversubscribe four vCPUs and the
      #  heaviest fixture then passes the 600s tool limit.  A work item is
      #  one fixture with its profiles in order, because a program may
      #  name a fixed file and two of its profiles would race on it.
      #
      #  The default stays at one job. This is the path CI exercises on
      #  every push, and flipping the default wants mileage rather than one
      #  good measurement; scripts/parallel-equivalence.sh is the guard.
      #
      #  LANDIN_TEST_TIMINGS puts the per-suite share and the slowest cases
      #  in the log, on standard error, so the next time this gets slow it
      #  says where rather than being inferred from timestamps.
      - name: The fixture corpus
        run: LANDIN_TEST_JOBS=2 LANDIN_TEST_TIMINGS=1 ./scripts/test.sh

  #  The compiler's scaling bound: generated programs of 1,000 to 16,000
  #  declarations, and the derived programs, checked and emitted five times
  #  each with the release compiler.  A doubling whose median frontend or
  #  emission time grows more than 2.5 times fails.  A ratio compares two runs on this runner a
  #  few seconds apart, so the verdict does not depend on its speed.  Its
  #  own job, because it needs the release build and nothing the corpus
  #  does.
  scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - name: The scaling benchmark
        run: ./scripts/scaling.sh
