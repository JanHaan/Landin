#  The gate: every target, unless verified explanatory edits reuse a full pass.
#  RV64 runs under QEMU's user emulation (rv64-qemu); its physical RISE jobs
#  stay suspended until they are dependable (see rv64-emit).
#
#  Verification lanes have separate verdicts.  Debug and release build jobs
#  supply artifacts to their same-host lanes (Linux arm64's release lane
#  builds its own); consumers check the source and toolchain manifests
#  before use.  A compile error surfaces in the build job, and `gate` needs
#  every job so any failure fails the gate.
#
#  Linux and Darwin jobs run on GitHub-hosted images, the same for every
#  event: the registered runners took 22 to 24 minutes for gates the hosted
#  images ran in 17 to 23, and their VMs shared cores with the Linux slots.
#  FreeBSD runs in VMs the jobs boot themselves.  Darwin uses
#  Xcode 26.6 on the hosted image; environments/macos-arm64/policy.json
#  records the tool policy.
#  Cortex-M runs on Linux x86-64 under its locked QEMU and GDB.
#  On both Linux architectures the debug and release compilers each run the
#  whole corpus, and each compiler builds for its own host by default
#  (D257), so the same commands run either lane.
#
#  It is still not the retired exact-revision acceptance: no successful
#  acceptance record is retained, and nothing accepts a revision.  If a
#  Cortex-M job fails and produced output, the workflow attempts to upload
#  its diagnostics for 14-day retention.  The gate is a safety net over
#  every target.
#  Cross-host determinism also contributes to the aggregate gate status.
#
#  AGENTS.md records observed job timings and their measurement limits.
#  Shared build artifacts are not acceptance records.

name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded candidates on one branch must not occupy the native hosts.
# Manual dispatch gets a separate group so a requested fresh run is retained.
concurrency:
  group: gate-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse requires the verified explanatory-only conditions in AGENTS.md.
  inputs:
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect a full pass for an identical candidate or explanatory edit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/gate_inputs.py reuse gate.yml \
            documents scripts linux-debug-build compiler-1 compiler-2 compiler-3 \
            compiler-checks linux-release-build \
            release bindings editor-grammar cortex-m scaling darwin-debug-build \
            darwin-release-build darwin-host darwin-host-release darwin-parity lldb \
            arm64-debug-build arm64-compiler-1 arm64-compiler-2 \
            arm64-compiler-checks arm64-release \
            freebsd-amd64-runtime freebsd-amd64-debugger freebsd-amd64-abi \
            freebsd-arm64-runtime-1 freebsd-arm64-runtime-2 \
            freebsd-arm64-debugger freebsd-arm64-abi build-modes-1 build-modes-2 \
            rv64-qemu-1 rv64-qemu-2 outside-user-stock \
            'determinism / manifest (x86_64-linux 1)' \
            'determinism / manifest (x86_64-linux 2)' \
            'determinism / manifest (aarch64-linux 1)' \
            'determinism / manifest (aarch64-linux 2)' \
            'determinism / manifest (aarch64-darwin 1)' \
            'determinism / manifest (aarch64-darwin 2)' 'determinism / agree' gate \
            >> "$GITHUB_OUTPUT"

  #  Documents, grammar and the transcription tables.  Nothing to install
  #  and nothing to build, so this is the fastest verdict available.
  #
  #  The licensed face is not fetched: check_fonts reports its coverage as
  #  not checked rather than failing, and pages.yml refuses to publish
  #  without it, so the coverage stays enforced where it matters and this
  #  job stays independent of the object storage.
  documents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check.py
        run: python3 check.py

  #  The Python suites no other job runs: every scripts/tests module,
  #  check.py's controls among them, and the determinism, quality and
  #  debugging controls.  Each check.py control breaks one input and
  #  requires the check to notice.  One after another the modules took
  #  eleven and a half minutes, ten of them the controls, so every module
  #  is its own process and the controls are dealt across shards; the log
  #  gives each process's time.
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/tests
        run: python3 scripts/script_tests.py

      - name: The determinism, quality and debugging controls
        run: |
          set -eu
          python3 compiler/tests/test_determinism_controls.py
          python3 compiler/tests/quality/test_check.py
          python3 compiler/tests/debugging/test_check.py

  #  Compile the debug executables once on Linux x86-64 for the debug suite,
  #  build-modes and determinism.  A job cannot wait on another job's step, so
  #  while the build was the suite's first step the manifests waited for
  #  the whole suite.  A compile error is reported here.
  #  Four units at once on the hosted runner's four CPUs.
  linux-debug-build:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - name: Build debug executables with bounded parallelism
        run: ./scripts/build.sh -j4

      - name: Package debug executables and both build manifests
        run: >-
          tar -czf "$RUNNER_TEMP/linux-amd64-debug.tar.gz"
          -C compiler/ada/build/linux-amd64/debug bin source-manifest.txt tests-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-amd64-debug
          path: ${{ runner.temp }}/linux-amd64-debug.tar.gz
          retention-days: 1

  #  The debug compiler's 800 cases, in three shards on three runners: on
  #  a hosted runner's four CPUs the whole program took 17.5 minutes, 567 s
  #  of it fixture execution and 212 s one truncation sweep.  Each ordinary
  #  case runs in one shard; the long cases that loop over the corpus are
  #  divided, each shard taking its share of their fixtures, and the
  #  harness's own `shards partition the inventory` holds the three to the
  #  complete run.  All three are required.
  compiler:
    name: compiler-${{ matrix.shard }}
    needs: [inputs, linux-debug-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-amd64-debug
          path: ${{ runner.temp }}/linux-amd64-debug

      - name: Restore and verify debug executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/debug
          tar -xzf "$RUNNER_TEMP/linux-amd64-debug/linux-amd64-debug.tar.gz" \
            -C compiler/ada/build/linux-amd64/debug
          ./scripts/build.sh -q

      #  Eight workers; the measurements below used four hosted vCPUs.
      #  A work item is one
      #  fixture with its profiles in order, a chain of compile, assemble,
      #  link and run, so the processes wait on each other and more workers
      #  than CPUs keeps them busy.  Measured on four CPUs, the fixture suite
      #  took 323 s at eight, 394 s at four and 389 s at two; the whole
      #  program about seven minutes.  Many workers is also how a race in
      #  the harness's reads went unseen, so the width is the point.
      #
      #  LANDIN_TEST_TIMINGS puts the per-suite share and the slowest cases
      #  in the log, on standard error, so the next time this gets slow it
      #  says where rather than being inferred from timestamps.
      - name: The fixture corpus, shard ${{ matrix.shard }} of 3
        run: >-
          LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1
          ./scripts/test.sh --shard=${{ matrix.shard }}/3

  #  The checks that need the debug compiler and no corpus, beside its
  #  shards rather than after one of them.
  compiler-checks:
    needs: [inputs, linux-debug-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-amd64-debug
          path: ${{ runner.temp }}/linux-amd64-debug

      - name: Restore and verify debug executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/debug
          tar -xzf "$RUNNER_TEMP/linux-amd64-debug/linux-amd64-debug.tar.gz" \
            -C compiler/ada/build/linux-amd64/debug
          ./scripts/build.sh -q

      #  The focused mode requires Emacs and the executable, then waits for a
      #  live refine diagnostic.
      - name: Install the required Emacs client
        run: |
          ./scripts/ci_packages.sh emacs-nox
          emacs --version | sed -n '1p'

      - name: Emacs starts refine lsp
        run: >-
          LANDIN_REFINE="$PWD/compiler/ada/build/linux-amd64/debug/bin/refine"
          ./highlight/test.sh --lsp-emacs

      #  The linked-image half needs the pinned driver on PATH, as
      #  scripts/env.sh puts it for the harness.
      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          refine="$PWD/compiler/ada/build/linux-amd64/debug/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine" --scratch /dev/shm/landin-loop
          LANDIN_REFINE="$refine" python3 -m unittest scripts.tests.test_cli_native
          python3 compiler/tests/server/native_session.py --refine "$refine"

      #  The sole direct source in each one-source positive, negative,
      #  runtime and ABI fixture directory, plus every reproducer, mutated
      #  once and given to refine lsp as an editor would, with the debug
      #  compiler, whose contracts are the stronger oracle.  The seed is
      #  fixed, so a hit is a mutant anyone can make again.  Each response
      #  is bounded at ten seconds and the server at 2 GiB.
      - name: The server under mutated sources
        run: >-
          python3 compiler/tests/fuzz/fuzz.py --seed 500000 --rounds 1
          --refine "$PWD/compiler/ada/build/linux-amd64/debug/bin/refine"
          --out "$RUNNER_TEMP/fuzz"

  #  Compile the release executables once on Linux for the corpus,
  #  build-modes, Cortex-M and scaling lanes.  The archive preserves executable permissions.
  linux-release-build:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANDIN_BUILD_MODE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - name: Build release executables
        run: ./scripts/build.sh -j4

      - name: Package release executables and both build manifests
        run: >-
          tar -czf "$RUNNER_TEMP/linux-release.tar.gz"
          -C compiler/ada/build/linux-amd64/release bin source-manifest.txt tests-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release.tar.gz
          retention-days: 1

  #  The same corpus with the release compiler, which is the one people run,
  #  and the lanes that measure or debug what it emits: object quality and
  #  the GDB sessions.  Release only, because the debug compiler's checks
  #  make those five times slower and add no coverage of their own.
  #  Measured: corpus 251 s, quality 26 s, GDB 36 s.
  release:
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q

      - name: The fixture corpus
        run: LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1 ./scripts/test.sh

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/linux-amd64/release/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-release-release
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          refine="$PWD/compiler/ada/build/linux-amd64/release/bin/refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine" --scratch /dev/shm/landin-loop
          LANDIN_REFINE="$refine" python3 -m unittest scripts.tests.test_cli_native
          python3 compiler/tests/server/native_session.py --refine "$refine"

      #  The release toolchain installed as the README says, then used from
      #  outside the checkout: the README's first program and every
      #  examples.md program, compiled with no option and run with no
      #  environment beyond PATH, against the documents' own oracles.  On
      #  Linux that PATH holds the pinned GNAT, whose driver is the one
      #  refine tries first; `outside-user-stock` runs it on Linux with the
      #  distribution's driver alone.
      - name: An installed toolchain outside the checkout
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          outside="$RUNNER_TEMP/outside"
          rm -rf "$outside"
          mkdir -p "$outside/prefix"
          ./scripts/package.sh --debug "$outside/landin-debug.tar.gz" "$PWD/compiler/ada/build/linux-amd64/release/bin/refine" "$outside/landin.tar.gz"
          tar -xzf "$outside/landin.tar.gz" -C "$outside/prefix"
          python3 scripts/outside_user.py --prefix "$outside/prefix" \
            --work "$outside/work"

      - name: Object quality
        run: ./scripts/quality.sh

      #  The GDB the pinned GNAT bundles, taken from PATH.
      - name: GDB source debugging
        run: |
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          ./scripts/debug.sh

  #  The determinism manifests compare hosts with their debug compilers, but
  #  people run the release one: here both builds of this tree compile the
  #  positive and runtime corpora and the Cortex-M counterparts at the four
  #  standard profiles, and must emit the same bytes.  Emission needs no
  #  assembler; the debug compiler is most of the cost, so the targets are
  #  dealt across two runners.
  #  D364: the same outside user on a stock Ubuntu, with the release
  #  compiler as a downloaded archive and only the image's own GCC, its
  #  `x86_64-linux-gnu-gcc`: no pinned toolchain is installed, and the
  #  job refuses to run if one is reachable, since then it would prove
  #  nothing a stock system can do.
  outside-user-stock:
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: The distribution's compiler and no other
        run: |
          set -eu
          if ! PATH=/usr/bin:/bin command -v x86_64-linux-gnu-gcc; then
            sudo apt-get update
            sudo apt-get install -y gcc
          fi
          if PATH=/usr/bin:/bin command -v x86_64-pc-linux-gnu-gcc; then
            echo "the pinned driver is reachable; this is not a stock system" >&2
            exit 1
          fi

      - name: An installed toolchain outside the checkout, on a stock system
        run: |
          set -eu
          outside="$RUNNER_TEMP/outside"
          rm -rf "$outside"
          mkdir -p "$outside/release" "$outside/prefix"
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" -C "$outside/release"
          ./scripts/package.sh --debug "$outside/landin-debug.tar.gz" "$outside/release/bin/refine" "$outside/landin.tar.gz"
          tar -xzf "$outside/landin.tar.gz" -C "$outside/prefix"
          PATH=/usr/bin:/bin python3 scripts/outside_user.py --stock \
            --prefix "$outside/prefix" --work "$outside/work"

  build-modes:
    name: build-modes-${{ matrix.part }}
    needs: [inputs, linux-debug-build, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            targets: linux-x86-64
          - part: 2
            targets: linux-arm64,cortex-m0
    env:
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-amd64-debug
          path: ${{ runner.temp }}/linux-amd64-debug

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify both compilers
        run: |
          set -eu
          mkdir -p compiler/ada/build/linux-amd64/debug compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-amd64-debug/linux-amd64-debug.tar.gz" \
            -C compiler/ada/build/linux-amd64/debug
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q
          LANDIN_BUILD_MODE=release ./scripts/build.sh -q

      - name: Both builds emit the same bytes, part ${{ matrix.part }}
        run: >-
          python3 scripts/emit_manifest.py modes
          compiler/ada/build/linux-amd64/debug/bin/refine
          compiler/ada/build/linux-amd64/release/bin/refine
          . ${{ matrix.targets }}

  #  The C binding generator against its pinned Clang, including the
  #  byte-for-byte regeneration of the committed fixture.  47 s.
  bindings:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Clang
        run: |
          set -eu
          . ./environments/pins.sh
          ./scripts/ci_packages.sh "clang-19=$LANDIN_CLANG_UBUNTU" libc6-dev
          installed=$(dpkg-query -W -f='${Version}' clang-19)
          if [ "$installed" != "$LANDIN_CLANG_UBUNTU" ]; then
            echo "clang-19 is $installed, not $LANDIN_CLANG_UBUNTU" >&2
            exit 1
          fi
          clang-19 --version | sed -n '1p'

      - name: The binding generator
        run: CLANG=clang-19 python3 bindings/test.py

  #  The structural editor grammar parses every positive, runtime and ABI
  #  fixture and all of core, with the pinned CLI.  The npm package's own
  #  install script would download the binary unverified, so it is not run:
  #  the release binary is fetched and checked against its pin instead.
  #  Regenerating the parser must reproduce the committed one.  10 s.
  editor-grammar:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # compare shipped grammar and queries with the pinned commit

      - name: Install the pinned tree-sitter CLI
        working-directory: highlight/tree-sitter
        run: |
          set -eu
          . ../../environments/pins.sh
          npm ci --ignore-scripts --no-audit --no-fund
          url="https://github.com/tree-sitter/tree-sitter/releases/download"
          curl -fsSL -o "$RUNNER_TEMP/tree-sitter.gz" \
            "$url/v$LANDIN_TREE_SITTER_VERSION/tree-sitter-linux-x64.gz"
          echo "$LANDIN_TREE_SITTER_SHA256_X86_64_LINUX  $RUNNER_TEMP/tree-sitter.gz" \
            | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/tree-sitter.gz" > node_modules/tree-sitter-cli/tree-sitter
          chmod 755 node_modules/tree-sitter-cli/tree-sitter
          ./node_modules/.bin/tree-sitter --version

      - name: The integration pass
        run: ./highlight/test.sh --integration

      - name: The committed parser is what the grammar generates
        run: git diff --exit-code -- highlight/tree-sitter

  #  QEMU and GDB on the locked tools, with the release compiler.
  #  Four workers, each with its own shared GDB: 612 s on the runner, and the
  #  whole job sixteen and a half minutes.
  cortex-m:
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q

      - name: Install the locked Cortex-M tools
        run: python3 environments/cortex-m/setup.py --tools "$RUNNER_TEMP/cortex-m"

      - name: The probe supervisor's controls
        run: python3 environments/cortex-m/test.py

      - name: Every Cortex-M lane
        run: |
          LANDIN_CORTEX_JOBS=4 python3 environments/cortex-m/run.py \
            --tools "$RUNNER_TEMP/cortex-m" \
            --refine "$PWD/compiler/ada/build/linux-amd64/release/bin/refine" \
            --output "$RUNNER_TEMP/cortex-m-evidence"

      #  D470's retained-profile measurement: the stack-switch consumer's
      #  flash, static RAM with its fibre backing, main-stack reservation,
      #  each fibre's backing and painted peak, and the fit verdict, at
      #  every profile.
      - name: Keep the stack-switch consumer's capacity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-m-fibre-capacity
          path: |
            ${{ runner.temp }}/cortex-m-evidence/evidence/capacity.json
            ${{ runner.temp }}/cortex-m-evidence/evidence/capacity.txt
          if-no-files-found: ignore
          retention-days: 90

      #  If a failed job produced Cortex-M output, upload its logs to help
      #  explain what the emulator or debugger said.
      - name: Keep the evidence of a failed lane
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-m-evidence
          path: ${{ runner.temp }}/cortex-m-evidence
          retention-days: 14

  #  The compiler's scaling bound: generated programs of 1,000 to 16,000
  #  declarations, and the derived programs, checked and emitted five times
  #  each with the release compiler.  A doubling whose median frontend or
  #  emission time grows more than 2.5 times fails.  A ratio compares two
  #  runs on this runner a few seconds apart, so the verdict does not
  #  depend on its speed.  A doubling over the bound is measured twice
  #  more, both sizes alternately, and fails only if every measurement
  #  misses; the log gives the runner's load beside each row.
  scaling:
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          LANDIN_BUILD_MODE=release ./scripts/build.sh -q

      - name: The scaling benchmark
        run: ./scripts/scaling.sh

  #  Compile the Darwin release executables once for the host suite,
  #  hosted parity and LLDB lanes.
  darwin-release-build:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANDIN_BUILD_MODE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - name: Build release executables
        run: ./scripts/build.sh -j3

      - name: Package release executables and both build manifests
        run: >-
          tar -czf "$RUNNER_TEMP/darwin-release.tar.gz"
          -C compiler/ada/build/darwin-arm64/release bin source-manifest.txt tests-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release.tar.gz
          retention-days: 1

  #  Compile the Darwin debug executables once for the host suite and
  #  determinism, which then need not wait for the suite.
  darwin-debug-build:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANDIN_BUILD_MODE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - name: Build debug executables with bounded parallelism
        run: ./scripts/build.sh -j3

      - name: Package debug executables and both build manifests
        run: >-
          tar -czf "$RUNNER_TEMP/darwin-arm64-debug.tar.gz"
          -C compiler/ada/build/darwin-arm64/debug bin source-manifest.txt tests-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64-debug
          path: ${{ runner.temp }}/darwin-arm64-debug.tar.gz
          retention-days: 1

  #  The debug compiler as a native Darwin host: every compiler case,
  #  without the two that execute Linux programs, then determinism closures,
  #  native report identity and the server.
  darwin-host:
    needs: [inputs, darwin-debug-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANDIN_BUILD_MODE: debug
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64-debug
          path: ${{ runner.temp }}/darwin-arm64-debug

      - name: Restore and verify debug executables
        run: |
          mkdir -p compiler/ada/build/darwin-arm64/debug
          tar -xzf "$RUNNER_TEMP/darwin-arm64-debug/darwin-arm64-debug.tar.gz" \
            -C compiler/ada/build/darwin-arm64/debug
          ./scripts/build.sh -q

      #  The host suite's shared verdicts are Linux x86-64's; a Mac's own
      #  compiler defaults to darwin-arm64 (D257), so the lane is named.
      - name: The compiler host suite
        run: ./scripts/test.sh --host --target=linux-x86-64

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/darwin-arm64/${{ env.LANDIN_BUILD_MODE }}/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-darwin-host-${{ env.LANDIN_BUILD_MODE }}
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          refine="$PWD/compiler/ada/build/darwin-arm64/$LANDIN_BUILD_MODE/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

  #  The same native host checks with the release compiler, using the
  #  checked artifact from this revision's Darwin release build.
  darwin-host-release:
    needs: [inputs, darwin-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/darwin-arm64/release
          tar -xzf "$RUNNER_TEMP/darwin-release/darwin-release.tar.gz" \
            -C compiler/ada/build/darwin-arm64/release
          ./scripts/build.sh -q

      - name: The compiler host suite
        run: ./scripts/test.sh --host --target=linux-x86-64

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/darwin-arm64/${{ env.LANDIN_BUILD_MODE }}/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-darwin-host-${{ env.LANDIN_BUILD_MODE }}
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          refine="$PWD/compiler/ada/build/darwin-arm64/$LANDIN_BUILD_MODE/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

      #  The release toolchain installed as the README says, then used from
      #  outside the checkout: the README's first program and every
      #  examples.md program, compiled with no option and run with no
      #  environment beyond PATH, against the documents' own oracles.  On
      #  Linux that PATH holds the pinned GNAT, whose driver is the one
      #  refine tries first; `outside-user-stock` runs it on Linux with the
      #  distribution's driver alone.
      - name: An installed toolchain outside the checkout
        run: |
          set -eu
          outside="$RUNNER_TEMP/outside"
          rm -rf "$outside"
          mkdir -p "$outside/prefix"
          ./scripts/package.sh --debug "$outside/landin-debug.tar.gz" "$PWD/compiler/ada/build/darwin-arm64/$LANDIN_BUILD_MODE/bin/refine" "$outside/landin.tar.gz"
          tar -xzf "$outside/landin.tar.gz" -C "$outside/prefix"
          python3 scripts/outside_user.py --prefix "$outside/prefix" \
            --work "$outside/work"

  #  The shared hosted corpus executed natively, every source verdict with
  #  Darwin selected, end-to-end fixtures among them, and the regenerated
  #  bindings and archives, with the release compiler.
  #
  #  Three workers, retaining the width measured on the hosted image.
  #  macOS vets each newly linked
  #  program on its first launch and admits roughly one at a time, so on an
  #  eight-core Mac this lane took 1,465 s at one worker and 755 s at four
  #  and at eight alike.  On the hosted image the whole job took fourteen
  #  minutes.
  darwin-parity:
    needs: [inputs, darwin-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/darwin-arm64/release
          tar -xzf "$RUNNER_TEMP/darwin-release/darwin-release.tar.gz" \
            -C compiler/ada/build/darwin-arm64/release
          ./scripts/build.sh -q

      - name: Hosted parity
        run: |
          LANDIN_DARWIN_JOBS=3 python3 compiler/tests/darwin/check.py --parity \
            --refine "$PWD/compiler/ada/build/darwin-arm64/release/bin/refine" \
            --output "$RUNNER_TEMP/parity"

      - name: Source verdicts
        run: |
          python3 compiler/tests/darwin/diagnostics.py \
            --refine "$PWD/compiler/ada/build/darwin-arm64/release/bin/refine" \
            --output "$RUNNER_TEMP/diagnostics"

      - name: Bindings and archives
        run: |
          python3 compiler/tests/darwin/bindings.py --parity \
            --refine "$PWD/compiler/ada/build/darwin-arm64/release/bin/refine" \
            --output "$RUNNER_TEMP/bindings"

  #  The LLDB sessions: the three derived programs at three profiles, the
  #  panic sessions and the source-debugging contract, with every dSYM,
  #  DWARF and Mach-O identity check.  41 s on a Mac, five minutes as a job.
  lldb:
    needs: [inputs, darwin-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/darwin-arm64/release
          tar -xzf "$RUNNER_TEMP/darwin-release/darwin-release.tar.gz" \
            -C compiler/ada/build/darwin-arm64/release
          ./scripts/build.sh -q

      - name: LLDB source debugging
        run: ./scripts/debug.sh --target=darwin-arm64 --parity --output "$RUNNER_TEMP/lldb"

  #  Compile the Linux arm64 debug executables once for arm64-compiler and
  #  determinism, which then need not wait for the suite.
  arm64-debug-build:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-linux

      - name: Build debug executables with bounded parallelism
        run: ./scripts/build.sh -j4

      - name: Package debug executables and both build manifests
        run: >-
          tar -czf "$RUNNER_TEMP/linux-arm64-debug.tar.gz"
          -C compiler/ada/build/linux-arm64/debug bin source-manifest.txt tests-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-debug
          path: ${{ runner.temp }}/linux-arm64-debug.tar.gz
          retention-days: 1

  #  Linux arm64 with the debug compiler: the whole test program, whose lane
  #  is this host's own, in two shards as `compiler` runs three; its corpus
  #  took 11.2 minutes on one hosted runner.
  arm64-compiler:
    name: arm64-compiler-${{ matrix.shard }}
    needs: [inputs, arm64-debug-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-arm64-debug
          path: ${{ runner.temp }}/linux-arm64-debug

      - name: Restore and verify debug executables
        run: |
          mkdir -p compiler/ada/build/linux-arm64/debug
          tar -xzf "$RUNNER_TEMP/linux-arm64-debug/linux-arm64-debug.tar.gz" \
            -C compiler/ada/build/linux-arm64/debug
          ./scripts/build.sh -q

      - name: The fixture corpus, shard ${{ matrix.shard }} of 2
        run: >-
          LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1
          ./scripts/test.sh --shard=${{ matrix.shard }}/2

  #  The checks that need the arm64 debug compiler and no corpus, the same
  #  as `compiler-checks` on the other architecture.
  arm64-compiler-checks:
    needs: [inputs, arm64-debug-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-arm64-debug
          path: ${{ runner.temp }}/linux-arm64-debug

      - name: Restore and verify debug executables
        run: |
          mkdir -p compiler/ada/build/linux-arm64/debug
          tar -xzf "$RUNNER_TEMP/linux-arm64-debug/linux-arm64-debug.tar.gz" \
            -C compiler/ada/build/linux-arm64/debug
          ./scripts/build.sh -q

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/linux-arm64/debug/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-arm64-compiler-debug
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: The default target, determinism closures, native report identity and the server
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          refine="$PWD/compiler/ada/build/linux-arm64/debug/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine" --scratch /dev/shm/landin-loop
          python3 compiler/tests/server/native_session.py --refine "$refine"

  #  Linux arm64 with the release compiler: the corpus, the GDB sessions
  #  with the GDB the pinned aarch64 GNAT bundles, and the generated
  #  bindings for the standard AAPCS64 with the pinned Clang's arm64 build.
  #  Eight minutes as a job.
  arm64-release:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      LANDIN_BUILD_MODE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-linux

      - name: Build release executables with bounded parallelism
        run: ./scripts/build.sh -j4

      - name: The fixture corpus
        run: LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1 ./scripts/test.sh

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/linux-arm64/release/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-arm64-release-release
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: The default target and the server
        run: |
          set -eu
          refine="$PWD/compiler/ada/build/linux-arm64/release/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine" --scratch /dev/shm/landin-loop
          python3 compiler/tests/server/native_session.py --refine "$refine"

      #  The release toolchain installed as the README says, then used from
      #  outside the checkout: the README's first program and every
      #  examples.md program, compiled with no option and run with no
      #  environment beyond PATH, against the documents' own oracles.  On
      #  Linux that PATH holds the pinned GNAT, whose driver is the one
      #  refine tries first; `outside-user-stock` runs it on Linux with the
      #  distribution's driver alone.
      - name: An installed toolchain outside the checkout
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          outside="$RUNNER_TEMP/outside"
          rm -rf "$outside"
          mkdir -p "$outside/prefix"
          ./scripts/package.sh --debug "$outside/landin-debug.tar.gz" "$PWD/compiler/ada/build/linux-arm64/release/bin/refine" "$outside/landin.tar.gz"
          tar -xzf "$outside/landin.tar.gz" -C "$outside/prefix"
          python3 scripts/outside_user.py --prefix "$outside/prefix" \
            --work "$outside/work"

      - name: GDB source debugging
        run: |
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          ./scripts/debug.sh

      - name: Install the pinned Clang
        run: |
          set -eu
          . ./environments/pins.sh
          ./scripts/ci_packages.sh "clang-19=$LANDIN_CLANG_UBUNTU" libc6-dev
          installed=$(dpkg-query -W -f='${Version}' clang-19)
          if [ "$installed" != "$LANDIN_CLANG_UBUNTU" ]; then
            echo "clang-19 is $installed, not $LANDIN_CLANG_UBUNTU" >&2
            exit 1
          fi
          clang-19 --version | sed -n '1p'

      - name: The generated bindings for the standard AAPCS64
        run: |
          PATH="$LANDIN_GNAT_HOME/bin:$PATH" python3 compiler/tests/linux-arm64/bindings.py \
            --refine "$PWD/compiler/ada/build/linux-arm64/release/bin/refine" \
            --clang clang-19 --output "$RUNNER_TEMP/bindings"

  #  Emit and inspect on Linux x86-64, then boot a fresh VM from the locked
  #  official FreeBSD image and execute there, all in one hosted job per
  #  lane.  amd64 runs under KVM, which the hosted x86-64 image offers once
  #  the job may open /dev/kvm.  arm64 runs under QEMU's system emulation
  #  with its `max` CPU, which has LSE, CRC32 and RDM: GitHub's arm64 images
  #  expose no KVM, their kernels logging "HYP mode not available" (probed
  #  in run 38921327105).  The release images and base archives are cached
  #  under the lock's digests; check.py verifies them either way.
  #
  #  The emulated arm64 runtime lane is the long one, emission and execution
  #  both by fixture, so it runs as two shards of whole fixtures; the
  #  first also owns the source verdicts.
  freebsd:
    name: freebsd-${{ matrix.arch }}-${{ matrix.kind }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, kind: runtime}
          - {arch: amd64, kind: debugger}
          - {arch: amd64, kind: abi}
          - {arch: arm64, kind: runtime, part: 1, shard: 1/2}
          - {arch: arm64, kind: runtime, part: 2, shard: 2/2}
          - {arch: arm64, kind: debugger}
          - {arch: arm64, kind: abi}
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
      LANDIN_FREEBSD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned compiler toolchain
        uses: ./.github/actions/pinned-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release
      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q
      - name: Install the cross driver, ELF tools and QEMU
        run: |
          . ./environments/pins.sh
          ./scripts/ci_packages.sh \
            "clang-19=$LANDIN_CLANG_UBUNTU" lld-19 llvm-19 libarchive-tools \
            qemu-utils ${{ matrix.arch == 'amd64' && 'qemu-system-x86'
              || 'qemu-system-arm qemu-efi-aarch64 ipxe-qemu' }}
          test "$(dpkg-query -W -f='${Version}' clang-19)" = "$LANDIN_CLANG_UBUNTU"
          clang-19 --version
      - name: Let the job open KVM
        if: matrix.arch == 'amd64'
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/landin/freebsd/${{ matrix.arch }}.raw.xz
            ~/.cache/landin/freebsd/${{ matrix.arch }}-base.txz
          key: freebsd-${{ matrix.arch }}-${{ hashFiles('environments/freebsd/lock.json') }}
      - name: Emit, boot and execute FreeBSD ${{ matrix.arch }} ${{ matrix.kind }} ${{ matrix.shard }}
        run: |
          python3 compiler/tests/freebsd/check.py \
            --arch=${{ matrix.arch }} --kind=${{ matrix.kind }} \
            ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }} \
            --refine="$PWD/compiler/ada/build/linux-amd64/release/bin/refine" \
            --output="$RUNNER_TEMP/freebsd-evidence"
      - name: Keep guest identity, feature probes and verdict transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebsd-${{ matrix.arch }}-${{ matrix.kind }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: |
            ${{ runner.temp }}/freebsd-evidence/*.json
            ${{ runner.temp }}/freebsd-evidence/*.log
            ${{ runner.temp }}/freebsd-evidence/bundle/*.stdout
            ${{ runner.temp }}/freebsd-evidence/bundle/*.stderr
            ${{ runner.temp }}/freebsd-evidence/bundle/*.status
          retention-days: 14

  #  The RV64 Linux lane under QEMU's user emulation: the release compiler's
  #  whole test program with linux-rv64 as its lane, every executable linked
  #  by Ubuntu's riscv64 cross driver and run by qemu-riscv64.  It is
  #  evidence about the emitted code and none about RV64 hardware or its
  #  native toolchain, which the suspended RISE jobs below were.  The
  #  emulator is the flake's qemu-user, LANDIN_CROSS_QEMU_NIX, not Ubuntu's
  #  8.2.2: that one gives a riscv64 sigaction a fourth word Linux's has
  #  not, so every program's rt_sigaction overwrote its own frame.  QEMU's
  #  `max` CPU with T-Head's address extension added confirms every RV64
  #  level the corpus runs; the emulator's own failures, a self-started
  #  program with no binfmt_misc handler and SO_RCVTIMEO, are the rows
  #  compiler/tests/cross-lanes.json lists, reported and not counted.  Two
  #  shards of the program, as the x86-64 debug suite is divided.
  rv64-qemu:
    name: rv64-qemu-${{ matrix.shard }}
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q

      - name: Install nix for the pinned emulator
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Install the pinned QEMU user emulation and the LP64D cross toolchain
        timeout-minutes: 25
        run: |
          set -eu
          nix build --out-link "$RUNNER_TEMP/qemu-user" .#qemu-user
          echo "$RUNNER_TEMP/qemu-user/bin" >> "$GITHUB_PATH"
          ./scripts/ci_packages.sh \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            gdb-multiarch
          . ./environments/pins.sh
          version=$("$RUNNER_TEMP/qemu-user/bin/qemu-riscv64" --version | sed -n '1p')
          echo "$version"
          case "$version" in
            "qemu-riscv64 version $LANDIN_CROSS_QEMU_NIX"*) ;;
            *) echo "not the pinned QEMU $LANDIN_CROSS_QEMU_NIX" >&2; exit 1 ;;
          esac
          riscv64-linux-gnu-gcc --version | sed -n '1p'
          riscv64-linux-gnu-objdump --version | sed -n '1p'
          test -f "$(riscv64-linux-gnu-gcc -print-file-name=libm.a)"
          ls /proc/sys/fs/binfmt_misc 2>/dev/null || echo "no binfmt_misc"

      #  Ubuntu's cross executables ask for /lib/ld-linux-riscv64-lp64d.so.1,
      #  which QEMU finds under its prefix.
      - name: The test program on the RV64 lane, shard ${{ matrix.shard }} of 2
        run: >-
          QEMU_LD_PREFIX=/usr/riscv64-linux-gnu QEMU_CPU=max,xtheadba=true
          LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1
          ./scripts/test.sh --target=linux-rv64 --runner=qemu-riscv64
          --shard=${{ matrix.shard }}/2

      #  The RV64 GDB sessions, the stack switch's backtraces among them
      #  (D469), through the same emulator's GDB stub rather than on the
      #  suspended physical runners; once, on the first shard.
      - name: The RV64 GDB sessions under QEMU's GDB stub
        if: matrix.shard == 1
        run: |
          python3 compiler/tests/rv64/check.py --prepare-only --kind=debugger \
            --refine="$PWD/compiler/ada/build/linux-amd64/release/bin/refine" \
            --output="$RUNNER_TEMP/rv64-debugger-payload"
          QEMU_CPU=max,xtheadba=true python3 compiler/tests/rv64/check.py \
            --kind=debugger --prepared="$RUNNER_TEMP/rv64-debugger-payload" \
            --output="$RUNNER_TEMP/rv64-debugger" \
            --qemu=qemu-riscv64 --gdb=gdb-multiarch

  # Checked Linux compiler cross-emits; RISE runs the transferred payloads on
  # physical RV64. ISA execution probes hardware before extended code runs.
  #
  #  The hardware jobs are suspended from the gates until further notice
  #  (2026-10-13): RISE queued them for hours, which held every gate verdict.
  #  rv64-qemu above is RV64's lane meanwhile.  Both jobs stay defined but
  #  skipped.  To resume, drop `false &&` from both conditions, and restore
  #  `rv64-emit, rv64` to the gate's needs and their eight leg names to the
  #  inputs list.
  rv64-emit:
    name: rv64-emit-${{ matrix.kind }}
    needs: [inputs, linux-release-build]
    if: false && needs.inputs.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [runtime, debugger, abi, isa]
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
      LANDIN_RV64_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned compiler toolchain
        uses: ./.github/actions/pinned-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release
      - name: Restore and verify checked release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q
      - name: Require the checked RV64 IR register verifier regression
        run: |
          ./scripts/test.sh --host --target=linux-x86-64 --case='backend/RV64 assembly registers are verified'
      - name: Install LP64D cross toolchain
        timeout-minutes: 25
        run: |
          ./scripts/ci_packages.sh \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross
          riscv64-linux-gnu-gcc --version
          riscv64-linux-gnu-as --version
          test -f "$(riscv64-linux-gnu-gcc -print-file-name=libm.a)"
      - name: Cross-emit and inspect RV64 ${{ matrix.kind }}
        run: |
          python3 compiler/tests/rv64/check.py --prepare-only --kind=${{ matrix.kind }} \
            --refine="$PWD/compiler/ada/build/linux-amd64/release/bin/refine" --output="$RUNNER_TEMP/rv64-payload"
          tar -czf "$RUNNER_TEMP/rv64-payload.tar.gz" -C "$RUNNER_TEMP/rv64-payload" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rv64-payload-${{ matrix.kind }}
          path: ${{ runner.temp }}/rv64-payload.tar.gz
          retention-days: 1
      - name: Retain cross-emission, instruction and refusal diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rv64-emit-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/rv64-payload/*.json
            ${{ runner.temp }}/rv64-payload/*.log
          retention-days: 14

  #  Suspended with rv64-emit above.
  rv64:
    name: rv64-${{ matrix.kind }}
    needs: [inputs, rv64-emit]
    if: false && needs.inputs.outputs.reuse != 'true'
    # RISE requires this exact label set; jobs are ephemeral physical machines.
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [runtime, debugger, abi, isa]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rv64-payload-${{ matrix.kind }}
          path: ${{ runner.temp }}/rv64-input
      - name: Confirm native tool availability
        timeout-minutes: 10
        run: |
          if ! command -v gdb; then
            ./scripts/ci_packages.sh gdb
          fi
          uname -a
          cat /proc/cpuinfo
          command -v python3
          command -v gdb
          gdb --version
      - name: Verify source-matching payload and execute RV64 ${{ matrix.kind }}
        run: |
          mkdir "$RUNNER_TEMP/rv64-prepared"
          tar -xzf "$RUNNER_TEMP/rv64-input/rv64-payload.tar.gz" -C "$RUNNER_TEMP/rv64-prepared"
          python3 compiler/tests/rv64/check.py --kind=${{ matrix.kind }} \
            --prepared="$RUNNER_TEMP/rv64-prepared" --output="$RUNNER_TEMP/rv64-evidence"
      - name: Package hardware identity and separate verdict transcripts
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/rv64-evidence"; then
            tar -czf "$RUNNER_TEMP/rv64-${{ matrix.kind }}.tar.gz" \
              --exclude=./bundle -C "$RUNNER_TEMP/rv64-evidence" .
          fi
      - name: Retain hardware identity and separate verdict transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rv64-${{ matrix.kind }}
          path: ${{ runner.temp }}/rv64-${{ matrix.kind }}.tar.gz
          compression-level: 0
          retention-days: 14

  #  Build and compare assembly manifests on Linux and macOS in the same
  #  workflow run, so a host disagreement also fails the aggregate status.
  #  The manifests start once each host's debug build is checked, beside
  #  that host's suite rather than after it.
  determinism:
    needs: [inputs, linux-debug-build, arm64-debug-build, darwin-debug-build]
    if: needs.inputs.outputs.reuse != 'true'
    uses: ./.github/workflows/determinism.yml
    with:
      debug-artifacts: true

  #  The one check a branch rule requires: every job above succeeded.
  gate:
    if: always()
    needs: [inputs, documents, scripts, linux-debug-build, compiler,
            compiler-checks, linux-release-build, release,
            outside-user-stock, build-modes,
            bindings, editor-grammar, cortex-m, scaling, darwin-debug-build,
            darwin-release-build, darwin-host, darwin-host-release,
            darwin-parity, lldb, arm64-debug-build, arm64-compiler,
            arm64-compiler-checks, arm64-release, freebsd, rv64-qemu,
            determinism]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job succeeded, or was skipped for a verified reused pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/gate_inputs.py verdict --always documents scripts
