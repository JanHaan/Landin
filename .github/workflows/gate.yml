name: Darwin metadata probe
on:
  push:
    branches: [integration/darwin-metadata-probe]
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          mkdir -p /tmp/landin-loop/metadata-probe
          printf '  x: u32 = 0\n' > /tmp/landin-loop/metadata-probe/source.ldn
          id
          cc -Wall -Wextra probe/metadata.c -o /tmp/metadata-probe
          /tmp/metadata-probe /tmp/landin-loop/metadata-probe/source.ldn
