#  The gate: every target, unless verified explanatory edits reuse a full pass.
#
#  Verification lanes have separate verdicts.  A release build job on each
#  host supplies an artifact to its same-host lanes; consumers check its
#  source and toolchain manifest before use.  A compile error surfaces in
#  the build job, and `gate` needs every job so any failure fails the gate.
#
#  Linux and Darwin jobs select the repository's self-hosted platform labels.
#  Fork pull requests keep the GitHub-hosted Linux and Darwin images.
#  Darwin uses the self-hosted Mac's selected tools, or Xcode 26.6 on the
#  hosted image; environments/macos-arm64/policy.json records the tool policy.
#  Cortex-M runs on Linux x86-64 under its locked QEMU and GDB.
#  On both Linux architectures the debug and release compilers each run the
#  whole corpus, and each compiler builds for its own host by default
#  (D257), so the same commands run either lane.
#
#  It is still not the retired exact-revision acceptance: no successful
#  acceptance record is retained, and nothing accepts a revision.  If a
#  Cortex-M job fails and produced output, the workflow attempts to upload
#  its diagnostics for 14-day retention.  The gate is a safety net over
#  every target.
#  Cross-host determinism also contributes to the aggregate gate status.
#
#  AGENTS.md records observed job timings and their measurement limits.
#  Shared build artifacts are not acceptance records.

name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded candidates on one branch must not occupy the native hosts.
# Manual dispatch gets a separate group so a requested fresh run is retained.
concurrency:
  group: gate-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse requires the verified explanatory-only conditions in AGENTS.md.
  #  The small classifier uses arm64 so it can release the compiler lanes
  #  while documents and scripts occupy the x86-64 runner.
  inputs:
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04-arm' || fromJSON('["self-hosted", "Linux", "ARM64", "linux-arm64"]') }}
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect a full pass for an identical candidate or explanatory edit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/gate_inputs.py reuse gate.yml \
            documents scripts compiler linux-release-build release bindings \
            editor-grammar cortex-m scaling darwin-release-build darwin-host \
            darwin-host-release darwin-parity lldb arm64-compiler arm64-release \
            freebsd-emit-amd64-runtime freebsd-emit-amd64-debugger freebsd-emit-amd64-abi \
            freebsd-emit-arm64-runtime freebsd-emit-arm64-debugger freebsd-emit-arm64-abi \
            freebsd-amd64-runtime freebsd-amd64-debugger freebsd-amd64-abi \
            freebsd-arm64-runtime freebsd-arm64-debugger freebsd-arm64-abi \
            rv64-emit-runtime rv64-emit-debugger rv64-emit-abi rv64-emit-isa \
            rv64-runtime rv64-debugger rv64-abi rv64-isa \
            'determinism / manifest (x86_64-linux)' \
            'determinism / manifest (aarch64-linux)' \
            'determinism / manifest (aarch64-darwin)' 'determinism / agree' gate \
            >> "$GITHUB_OUTPUT"

  #  Documents, grammar and the transcription tables.  Nothing to install
  #  and nothing to build, so this is the fastest verdict available.
  #
  #  The licensed face is not fetched: check_fonts reports its coverage as
  #  not checked rather than failing, and pages.yml refuses to publish
  #  without it, so the coverage stays enforced where it matters and this
  #  job stays independent of the object storage.
  documents:
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check.py
        run: python3 check.py

  #  The Python suites no other job runs: every scripts/tests module,
  #  check.py's controls among them, and the determinism, quality and
  #  debugging controls.  Each check.py control breaks one input and
  #  requires the check to notice; about five and a half minutes.
  scripts:
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/tests
        run: |
          set -eu
          for test in scripts/tests/test_*.py; do
            echo "== $test"
            python3 "$test"
          done

      - name: The determinism, quality and debugging controls
        run: |
          set -eu
          python3 compiler/tests/test_determinism_controls.py
          python3 compiler/tests/quality/test_check.py
          python3 compiler/tests/debugging/test_check.py

  #  The debug compiler and all 800 cases, then the checks that need a built
  #  compiler and no corpus.  scripts/test.sh builds first, so this is also
  #  where a compile error is reported.
  compiler:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      #  Eight workers; the measurements below used four hosted vCPUs.
      #  A work item is one
      #  fixture with its profiles in order, a chain of compile, assemble,
      #  link and run, so the processes wait on each other and more workers
      #  than CPUs keeps them busy.  Measured on four CPUs, the fixture suite
      #  took 323 s at eight, 394 s at four and 389 s at two; the whole
      #  program about seven minutes.  Many workers is also how a race in
      #  the harness's reads went unseen, so the width is the point.
      #
      #  LANDIN_TEST_TIMINGS puts the per-suite share and the slowest cases
      #  in the log, on standard error, so the next time this gets slow it
      #  says where rather than being inferred from timestamps.
      - name: Build debug executables with bounded parallelism
        run: ./scripts/build.sh -j4

      - name: Package the checked debug compiler for determinism
        run: >-
          tar -czf "$RUNNER_TEMP/linux-amd64-debug.tar.gz"
          -C compiler/ada/build/linux-amd64/debug bin/refine source-manifest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-amd64-debug
          path: ${{ runner.temp }}/linux-amd64-debug.tar.gz
          retention-days: 1

      - name: The fixture corpus
        run: LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1 ./scripts/test.sh

      #  Use the compiler this job already built.  The focused mode requires
      #  Emacs and the executable, then waits for a live refine diagnostic.
      - name: Install the required Emacs client
        run: |
          ./scripts/ci_packages.sh emacs-nox
          emacs --version | sed -n '1p'

      - name: Emacs starts refine lsp
        run: >-
          LANDIN_REFINE="$PWD/compiler/ada/build/linux-amd64/debug/bin/refine"
          ./highlight/test.sh --lsp-emacs

      #  The linked-image half needs the pinned driver on PATH, as
      #  scripts/env.sh puts it for the harness.
      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          refine="$PWD/compiler/ada/build/linux-amd64/debug/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

      #  The sole direct source in each one-source positive, negative,
      #  runtime and ABI fixture directory, plus every reproducer, mutated
      #  once and given to refine lsp as an editor would, with the debug
      #  compiler, whose contracts are the stronger oracle.  The seed is
      #  fixed, so a hit is a mutant anyone can make again.  Each response
      #  is bounded at ten seconds and the server at 2 GiB.
      - name: The server under mutated sources
        run: >-
          python3 compiler/tests/fuzz/fuzz.py --seed 500000 --rounds 1
          --refine "$PWD/compiler/ada/build/linux-amd64/debug/bin/refine"
          --out "$RUNNER_TEMP/fuzz"

  #  Compile the release executables once on Linux for the corpus, Cortex-M
  #  and scaling lanes.  The archive preserves executable permissions.
  linux-release-build:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    timeout-minutes: 30
    env:
      LANDIN_BUILD_MODE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - name: Build release executables
        run: ./scripts/build.sh -j4

      - name: Package release executables and both build manifests
        run: >-
          tar -czf "$RUNNER_TEMP/linux-release.tar.gz"
          -C compiler/ada/build/linux-amd64/release bin source-manifest.txt tests-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release.tar.gz
          retention-days: 1

  #  The same corpus with the release compiler, which is the one people run,
  #  and the lanes that measure or debug what it emits: object quality and
  #  the GDB sessions.  Release only, because the debug compiler's checks
  #  make those five times slower and add no coverage of their own.
  #  Measured: corpus 251 s, quality 26 s, GDB 36 s.
  release:
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    timeout-minutes: 60
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q

      - name: The fixture corpus
        run: LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1 ./scripts/test.sh

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/linux-amd64/release/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-release-release
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          refine="$PWD/compiler/ada/build/linux-amd64/release/bin/refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

      - name: Object quality
        run: ./scripts/quality.sh

      #  The GDB the pinned GNAT bundles, taken from PATH.
      - name: GDB source debugging
        run: |
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          ./scripts/debug.sh

  #  The C binding generator against its pinned Clang, including the
  #  byte-for-byte regeneration of the committed fixture.  47 s.
  bindings:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Clang
        run: |
          set -eu
          . ./environments/pins.sh
          ./scripts/ci_packages.sh "clang-19=$LANDIN_CLANG_UBUNTU" libc6-dev
          installed=$(dpkg-query -W -f='${Version}' clang-19)
          if [ "$installed" != "$LANDIN_CLANG_UBUNTU" ]; then
            echo "clang-19 is $installed, not $LANDIN_CLANG_UBUNTU" >&2
            exit 1
          fi
          clang-19 --version | sed -n '1p'

      - name: The binding generator
        run: CLANG=clang-19 python3 bindings/test.py

  #  The structural editor grammar parses every positive, runtime and ABI
  #  fixture and all of core, with the pinned CLI.  The npm package's own
  #  install script would download the binary unverified, so it is not run:
  #  the release binary is fetched and checked against its pin instead.
  #  Regenerating the parser must reproduce the committed one.  10 s.
  editor-grammar:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # compare shipped grammar and queries with the pinned commit

      - name: Install Node.js and npm on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: ./scripts/ci_packages.sh nodejs npm

      - name: Install the pinned tree-sitter CLI
        working-directory: highlight/tree-sitter
        run: |
          set -eu
          . ../../environments/pins.sh
          npm ci --ignore-scripts --no-audit --no-fund
          url="https://github.com/tree-sitter/tree-sitter/releases/download"
          curl -fsSL -o "$RUNNER_TEMP/tree-sitter.gz" \
            "$url/v$LANDIN_TREE_SITTER_VERSION/tree-sitter-linux-x64.gz"
          echo "$LANDIN_TREE_SITTER_SHA256_X86_64_LINUX  $RUNNER_TEMP/tree-sitter.gz" \
            | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/tree-sitter.gz" > node_modules/tree-sitter-cli/tree-sitter
          chmod 755 node_modules/tree-sitter-cli/tree-sitter
          ./node_modules/.bin/tree-sitter --version

      - name: The integration pass
        run: ./highlight/test.sh --integration

      - name: The committed parser is what the grammar generates
        run: git diff --exit-code -- highlight/tree-sitter

  #  QEMU and GDB on the locked tools, with the release compiler.
  #  Four workers, each with its own shared GDB: 612 s on the runner, and the
  #  whole job sixteen and a half minutes.
  cortex-m:
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    timeout-minutes: 60
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q

      - name: Install the locked Cortex-M tools
        run: python3 environments/cortex-m/setup.py --tools "$RUNNER_TEMP/cortex-m"

      - name: The probe supervisor's controls
        run: python3 environments/cortex-m/test.py

      - name: Every Cortex-M lane
        run: |
          LANDIN_CORTEX_JOBS=4 python3 environments/cortex-m/run.py \
            --tools "$RUNNER_TEMP/cortex-m" \
            --refine "$PWD/compiler/ada/build/linux-amd64/release/bin/refine" \
            --output "$RUNNER_TEMP/cortex-m-evidence"

      #  If a failed job produced Cortex-M output, upload its logs to help
      #  explain what the emulator or debugger said.
      - name: Keep the evidence of a failed lane
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-m-evidence
          path: ${{ runner.temp }}/cortex-m-evidence
          retention-days: 14

  #  The compiler's scaling bound: generated programs of 1,000 to 16,000
  #  declarations, and the derived programs, checked and emitted five times
  #  each with the release compiler.  A doubling whose median frontend or
  #  emission time grows more than 2.5 times fails.  A ratio compares two
  #  runs on this runner a few seconds apart, so the verdict does not
  #  depend on its speed.
  scaling:
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    timeout-minutes: 30
    env:
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          LANDIN_BUILD_MODE=release ./scripts/build.sh -q

      - name: The scaling benchmark
        run: ./scripts/scaling.sh

  #  Compile the Darwin release executables once for the host suite,
  #  hosted parity and LLDB lanes.
  darwin-release-build:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'macos-26' || fromJSON('["self-hosted", "macOS", "ARM64", "darwin-arm64"]') }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      LANDIN_BUILD_MODE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - name: Build release executables
        run: ./scripts/build.sh -j3

      - name: Package release executables and both build manifests
        run: >-
          tar -czf "$RUNNER_TEMP/darwin-release.tar.gz"
          -C compiler/ada/build/darwin-arm64/release bin source-manifest.txt tests-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release.tar.gz
          retention-days: 1

  #  The debug compiler as a native Darwin host: every compiler case,
  #  without the two that execute Linux programs, then determinism closures,
  #  native report identity and the server.
  darwin-host:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'macos-26' || fromJSON('["self-hosted", "macOS", "ARM64", "darwin-arm64"]') }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      LANDIN_BUILD_MODE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - name: Build debug executables with bounded parallelism
        run: ./scripts/build.sh -j3

      - name: Package the checked debug compiler for determinism
        run: >-
          tar -czf "$RUNNER_TEMP/darwin-arm64-debug.tar.gz"
          -C compiler/ada/build/darwin-arm64/debug bin/refine source-manifest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64-debug
          path: ${{ runner.temp }}/darwin-arm64-debug.tar.gz
          retention-days: 1

      #  The host suite's shared verdicts are Linux x86-64's; a Mac's own
      #  compiler defaults to darwin-arm64 (D257), so the lane is named.
      - name: The compiler host suite
        run: ./scripts/test.sh --host --target=linux-x86-64

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/darwin-arm64/${{ env.LANDIN_BUILD_MODE }}/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-darwin-host-${{ env.LANDIN_BUILD_MODE }}
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          refine="$PWD/compiler/ada/build/darwin-arm64/$LANDIN_BUILD_MODE/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

  #  The same native host checks with the release compiler, using the
  #  checked artifact from this revision's Darwin release build.
  darwin-host-release:
    needs: [inputs, darwin-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'macos-26' || fromJSON('["self-hosted", "macOS", "ARM64", "darwin-arm64"]') }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/darwin-arm64/release
          tar -xzf "$RUNNER_TEMP/darwin-release/darwin-release.tar.gz" \
            -C compiler/ada/build/darwin-arm64/release
          ./scripts/build.sh -q

      - name: The compiler host suite
        run: ./scripts/test.sh --host --target=linux-x86-64

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/darwin-arm64/${{ env.LANDIN_BUILD_MODE }}/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-darwin-host-${{ env.LANDIN_BUILD_MODE }}
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: Determinism closures, native report identity and the server
        run: |
          set -eu
          refine="$PWD/compiler/ada/build/darwin-arm64/$LANDIN_BUILD_MODE/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

  #  The shared hosted corpus executed natively, every source verdict with
  #  Darwin selected, end-to-end fixtures among them, and the regenerated
  #  bindings and archives, with the release compiler.
  #
  #  Three workers, retaining the width measured on the hosted image.
  #  macOS vets each newly linked
  #  program on its first launch and admits roughly one at a time, so on an
  #  eight-core Mac this lane took 1,465 s at one worker and 755 s at four
  #  and at eight alike.  On the hosted image the whole job took fourteen
  #  minutes; no timing is assumed for the self-hosted Mac.
  darwin-parity:
    needs: [inputs, darwin-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'macos-26' || fromJSON('["self-hosted", "macOS", "ARM64", "darwin-arm64"]') }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/darwin-arm64/release
          tar -xzf "$RUNNER_TEMP/darwin-release/darwin-release.tar.gz" \
            -C compiler/ada/build/darwin-arm64/release
          ./scripts/build.sh -q

      - name: Hosted parity
        run: |
          LANDIN_DARWIN_JOBS=3 python3 compiler/tests/darwin/check.py --parity \
            --refine "$PWD/compiler/ada/build/darwin-arm64/release/bin/refine" \
            --output "$RUNNER_TEMP/parity"

      - name: Source verdicts
        run: |
          python3 compiler/tests/darwin/diagnostics.py \
            --refine "$PWD/compiler/ada/build/darwin-arm64/release/bin/refine" \
            --output "$RUNNER_TEMP/diagnostics"

      - name: Bindings and archives
        run: |
          python3 compiler/tests/darwin/bindings.py --parity \
            --refine "$PWD/compiler/ada/build/darwin-arm64/release/bin/refine" \
            --output "$RUNNER_TEMP/bindings"

  #  The LLDB sessions: the three derived programs at three profiles, the
  #  panic sessions and the source-debugging contract, with every dSYM,
  #  DWARF and Mach-O identity check.  41 s on a Mac, five minutes as a job.
  lldb:
    needs: [inputs, darwin-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'macos-26' || fromJSON('["self-hosted", "macOS", "ARM64", "darwin-arm64"]') }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-release
          path: ${{ runner.temp }}/darwin-release

      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/darwin-arm64/release
          tar -xzf "$RUNNER_TEMP/darwin-release/darwin-release.tar.gz" \
            -C compiler/ada/build/darwin-arm64/release
          ./scripts/build.sh -q

      - name: LLDB source debugging
        run: ./scripts/debug.sh --target=darwin-arm64 --parity --output "$RUNNER_TEMP/lldb"

  #  Linux arm64 with the debug compiler: the whole test program, whose lane
  #  is this host's own, then the checks that need a compiler and no
  #  corpus.  The same steps as `compiler` on the other architecture.
  #  Eleven minutes as a job.
  arm64-compiler:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04-arm' || fromJSON('["self-hosted", "Linux", "ARM64", "linux-arm64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-linux

      - name: Build debug executables with bounded parallelism
        run: ./scripts/build.sh -j4

      - name: Package the checked debug compiler for determinism
        run: >-
          tar -czf "$RUNNER_TEMP/linux-arm64-debug.tar.gz"
          -C compiler/ada/build/linux-arm64/debug bin/refine source-manifest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-debug
          path: ${{ runner.temp }}/linux-arm64-debug.tar.gz
          retention-days: 1

      - name: The fixture corpus
        run: LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1 ./scripts/test.sh

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/linux-arm64/debug/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-arm64-compiler-debug
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: The default target, determinism closures, native report identity and the server
        run: |
          set -eu
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          refine="$PWD/compiler/ada/build/linux-arm64/debug/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_determinism.py --refine "$refine"
          python3 compiler/tests/test_native_report_identity.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

  #  Linux arm64 with the release compiler: the corpus, the GDB sessions
  #  with the GDB the pinned aarch64 GNAT bundles, and the generated
  #  bindings for the standard AAPCS64 with the pinned Clang's arm64 build.
  #  Eight minutes as a job.
  arm64-release:
    needs: inputs
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04-arm' || fromJSON('["self-hosted", "Linux", "ARM64", "linux-arm64"]') }}
    timeout-minutes: 60
    env:
      LANDIN_BUILD_MODE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: aarch64-linux

      - name: Build release executables with bounded parallelism
        run: ./scripts/build.sh -j4

      - name: The fixture corpus
        run: LANDIN_TEST_JOBS=8 LANDIN_TEST_TIMINGS=1 ./scripts/test.sh

      # Representative process measurements; low-stack outcomes are recorded,
      # not required thresholds. The full scaling verdict has its own job.
      - name: Representative verifier resource observations
        run: >-
          python3 scripts/verifier_resources.py
          --refine "$PWD/compiler/ada/build/linux-arm64/release/bin/refine"
          --output "$RUNNER_TEMP/verifier-resources"

      - name: Keep representative resource observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-resources-arm64-release-release
          path: ${{ runner.temp }}/verifier-resources
          retention-days: 14

      - name: The default target and the server
        run: |
          set -eu
          refine="$PWD/compiler/ada/build/linux-arm64/release/bin/refine"
          python3 compiler/tests/test_default_target.py --refine "$refine"
          python3 compiler/tests/test_formatter_write_safety.py --refine "$refine"
          python3 compiler/tests/server/native_session.py --refine "$refine"

      - name: GDB source debugging
        run: |
          PATH="$LANDIN_GNAT_HOME/bin:$PATH"
          ./scripts/debug.sh

      - name: Install the pinned Clang
        run: |
          set -eu
          . ./environments/pins.sh
          ./scripts/ci_packages.sh "clang-19=$LANDIN_CLANG_UBUNTU" libc6-dev
          installed=$(dpkg-query -W -f='${Version}' clang-19)
          if [ "$installed" != "$LANDIN_CLANG_UBUNTU" ]; then
            echo "clang-19 is $installed, not $LANDIN_CLANG_UBUNTU" >&2
            exit 1
          fi
          clang-19 --version | sed -n '1p'

      - name: The generated bindings for the standard AAPCS64
        run: |
          PATH="$LANDIN_GNAT_HOME/bin:$PATH" python3 compiler/tests/linux-arm64/bindings.py \
            --refine "$PWD/compiler/ada/build/linux-arm64/release/bin/refine" \
            --clang clang-19 --output "$RUNNER_TEMP/bindings"

  # Emit and inspect on Linux x86-64, then execute the checked payloads in
  # the matching accelerated FreeBSD VMs hosted on the Linux self-hosted runners.
  freebsd-emit:
    name: freebsd-emit-${{ matrix.arch }}-${{ matrix.kind }}
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kind: [runtime, debugger, abi]
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
      LANDIN_FREEBSD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned compiler toolchain
        uses: ./.github/actions/pinned-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release
      - name: Restore and verify release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" \
            -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q
      - name: Install the cross driver and ELF tools
        run: |
          . ./environments/pins.sh
          ./scripts/ci_packages.sh \
            "clang-19=$LANDIN_CLANG_UBUNTU" lld-19 llvm-19 libarchive-tools
          test "$(dpkg-query -W -f='${Version}' clang-19)" = "$LANDIN_CLANG_UBUNTU"
          clang-19 --version
      - name: Emit and inspect FreeBSD ${{ matrix.arch }} ${{ matrix.kind }}
        run: |
          python3 compiler/tests/freebsd/check.py --prepare-only \
            --arch=${{ matrix.arch }} --kind=${{ matrix.kind }} \
            --refine="$PWD/compiler/ada/build/linux-amd64/release/bin/refine" \
            --cache="$RUNNER_TEMP/freebsd-cache" --output="$RUNNER_TEMP/freebsd-payload"
          tar -czf "$RUNNER_TEMP/freebsd-payload.tar.gz" -C "$RUNNER_TEMP/freebsd-payload" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebsd-payload-${{ matrix.arch }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/freebsd-payload.tar.gz
          retention-days: 1
      - name: Keep failed emission diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebsd-emit-${{ matrix.arch }}-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/freebsd-payload/*.json
            ${{ runner.temp }}/freebsd-payload/*.log
          retention-days: 14

  freebsd:
    name: freebsd-${{ matrix.arch }}-${{ matrix.kind }}
    needs: [inputs, freebsd-emit]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: [self-hosted, "freebsd-${{ matrix.arch }}"]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        kind: [runtime, debugger, abi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: freebsd-payload-${{ matrix.arch }}-${{ matrix.kind }}
          path: ${{ runner.temp }}/freebsd-input
      - name: Execute and debug in the Linux-hosted FreeBSD VM
        run: |
          mkdir "$RUNNER_TEMP/freebsd-prepared"
          tar -xzf "$RUNNER_TEMP/freebsd-input/freebsd-payload.tar.gz" -C "$RUNNER_TEMP/freebsd-prepared"
          python3 compiler/tests/freebsd/check.py \
            --arch=${{ matrix.arch }} --kind=${{ matrix.kind }} \
            --prepared="$RUNNER_TEMP/freebsd-prepared" --output="$RUNNER_TEMP/freebsd-evidence" \
            --runner-ssh='ssh -T -p 2222 -i /home/runner/.ssh/freebsd -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 ci@freebsd-vm'
      - name: Keep guest identity, feature probes and verdict transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebsd-${{ matrix.arch }}-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/freebsd-evidence/*.json
            ${{ runner.temp }}/freebsd-evidence/*.log
            ${{ runner.temp }}/freebsd-evidence/bundle/*.stdout
            ${{ runner.temp }}/freebsd-evidence/bundle/*.stderr
            ${{ runner.temp }}/freebsd-evidence/bundle/*.status
          retention-days: 14

  # Checked Linux compiler cross-emits; RISE runs the transferred payloads on
  # physical RV64. ISA execution probes hardware before extended code runs.
  rv64-emit:
    name: rv64-emit-${{ matrix.kind }}
    needs: [inputs, linux-release-build]
    if: needs.inputs.outputs.reuse != 'true'
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [runtime, debugger, abi, isa]
    env:
      LANDIN_BUILD_MODE: release
      LANDIN_BUILD_REUSE: 'yes'
      LANDIN_RV64_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned compiler toolchain
        uses: ./.github/actions/pinned-toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: ${{ runner.temp }}/linux-release
      - name: Restore and verify checked release executables
        run: |
          mkdir -p compiler/ada/build/linux-amd64/release
          tar -xzf "$RUNNER_TEMP/linux-release/linux-release.tar.gz" -C compiler/ada/build/linux-amd64/release
          ./scripts/build.sh -q
      - name: Require the checked RV64 IR register verifier regression
        run: |
          ./scripts/test.sh --host --target=linux-x86-64 --case='backend/RV64 assembly registers are verified'
      - name: Install LP64D cross toolchain
        timeout-minutes: 25
        run: |
          ./scripts/ci_packages.sh \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross
          riscv64-linux-gnu-gcc --version
          riscv64-linux-gnu-as --version
          test -f "$(riscv64-linux-gnu-gcc -print-file-name=libm.a)"
      - name: Cross-emit and inspect RV64 ${{ matrix.kind }}
        run: |
          python3 compiler/tests/rv64/check.py --prepare-only --kind=${{ matrix.kind }} \
            --refine="$PWD/compiler/ada/build/linux-amd64/release/bin/refine" --output="$RUNNER_TEMP/rv64-payload"
          tar -czf "$RUNNER_TEMP/rv64-payload.tar.gz" -C "$RUNNER_TEMP/rv64-payload" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rv64-payload-${{ matrix.kind }}
          path: ${{ runner.temp }}/rv64-payload.tar.gz
          retention-days: 1
      - name: Retain cross-emission, instruction and refusal diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rv64-emit-${{ matrix.kind }}
          path: |
            ${{ runner.temp }}/rv64-payload/*.json
            ${{ runner.temp }}/rv64-payload/*.log
          retention-days: 14

  rv64:
    name: rv64-${{ matrix.kind }}
    needs: [inputs, rv64-emit]
    if: needs.inputs.outputs.reuse != 'true'
    # RISE requires this exact label set; jobs are ephemeral physical machines.
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [runtime, debugger, abi, isa]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rv64-payload-${{ matrix.kind }}
          path: ${{ runner.temp }}/rv64-input
      - name: Confirm native tool availability
        timeout-minutes: 10
        run: |
          if ! command -v gdb; then
            ./scripts/ci_packages.sh gdb
          fi
          uname -a
          cat /proc/cpuinfo
          command -v python3
          command -v gdb
          gdb --version
      - name: Verify source-matching payload and execute RV64 ${{ matrix.kind }}
        run: |
          mkdir "$RUNNER_TEMP/rv64-prepared"
          tar -xzf "$RUNNER_TEMP/rv64-input/rv64-payload.tar.gz" -C "$RUNNER_TEMP/rv64-prepared"
          python3 compiler/tests/rv64/check.py --kind=${{ matrix.kind }} \
            --prepared="$RUNNER_TEMP/rv64-prepared" --output="$RUNNER_TEMP/rv64-evidence"
      - name: Package hardware identity and separate verdict transcripts
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/rv64-evidence"; then
            tar -czf "$RUNNER_TEMP/rv64-${{ matrix.kind }}.tar.gz" \
              --exclude=./bundle -C "$RUNNER_TEMP/rv64-evidence" .
          fi
      - name: Retain hardware identity and separate verdict transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rv64-${{ matrix.kind }}
          path: ${{ runner.temp }}/rv64-${{ matrix.kind }}.tar.gz
          compression-level: 0
          retention-days: 14

  #  Build and compare assembly manifests on Linux and macOS in the same
  #  workflow run, so a host disagreement also fails the aggregate status.
  determinism:
    needs: [inputs, compiler, arm64-compiler, darwin-host]
    if: needs.inputs.outputs.reuse != 'true'
    uses: ./.github/workflows/determinism.yml
    with:
      # Fork fallback uses different Mac images in the two workflows.
      debug-artifacts: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  #  The one check a branch rule requires: every job above succeeded.
  gate:
    if: always()
    needs: [inputs, documents, scripts, compiler, linux-release-build, release,
            bindings, editor-grammar, cortex-m, scaling, darwin-release-build,
            darwin-host, darwin-host-release, darwin-parity, lldb,
            arm64-compiler, arm64-release, freebsd-emit, freebsd, rv64-emit, rv64, determinism]
    runs-on: >-
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
          && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "linux-amd64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job succeeded, or was skipped for a verified reused pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/gate_inputs.py verdict --always documents scripts
