#  The minimal gate: does the compiler still build, and does the corpus
#  still pass?
#
#  Until this existed nothing verified anything about the compiler on a
#  push. `determinism.yml` emits assembly and hashes it but never
#  assembles, links or runs; `pages.yml` publishes; `links.yml` checks
#  URLs. check.py -- the grammar, the transcription tables, the citations,
#  the document graph -- ran only when somebody typed it.
#
#  That gap mattered most for the work queued behind it. Rewriting spec.md
#  and tour.md means showing the rewritten documents describe the same
#  language, and the things that show it are check.py's grammar corpus and
#  the fixture suite. A safety net nobody runs is not one.
#
#  This is deliberately small. It is not the replacement for the retired
#  exact-revision acceptance: no Darwin, no Cortex-M execution, no
#  debugger, no bindings, no release mode, no evidence retained. It builds
#  the compiler on Linux and runs the two things that fail loudly when the
#  language moves. MOVING.md records what a real gate still owes.
#
#  Two jobs, because the first measurement was lopsided: check.py and the
#  build together take two and a half minutes, and the 741-case corpus
#  takes fifty-nine. Waiting an hour for a verdict on a typo is how a gate
#  stops being read. `fast` is the signal to watch; `corpus` runs beside it
#  on the same push and nothing is skipped.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #  Documents, grammar, transcription tables, and that the compiler still
  #  builds. Two and a half minutes, so it is the one worth waiting for.
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      #  The licensed face is not fetched here: check_fonts reports its
      #  coverage as not checked rather than failing, and pages.yml refuses
      #  to publish without it, so the coverage stays enforced where it
      #  matters and this job stays independent of the object storage.
      - name: check.py
        run: python3 check.py

      - name: Build refine
        run: ./scripts/build.sh -j4

  #  All 741 cases. Slow, and running beside `fast` rather than in front of
  #  it, so a green corpus is still required on every push.
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain

      - name: The fixture corpus
        run: ./scripts/test.sh
