#  Publish the reading copies at https://www.701.dev.
#
#  This is not a gate.  It renders the documents, verifies that the render
#  dropped nothing, and deploys; it runs no compiler test.  The gate is
#  gate.yml.
#
#  The licensed code face is not in this repository and never will be:
#  MonoLisa's EULA licenses it to one licensee and forbids supplying the
#  font data on.  It is fetched at build time from the maintainer's own
#  object storage, which is also where a developer's checkout comes from.
#  A build that cannot reach it renders in the fallback stack, so the
#  fetch is fatal rather than best-effort.

name: pages

on:
  push:
    branches: [main]
    # Keep this list in step with render_html.py's DOCS/GUIDES and its
    # other source reads (including llms.py and the examples' fixture metadata).
    paths:
      - '.github/workflows/pages.yml'
      - 'spec.md'
      - 'tour.md'
      - 'prototype-1-driver.md'
      - 'prototype-2-parser.md'
      - 'prototype-3-containers.md'
      - 'prototype-4-app.md'
      - 'docs/documents.md'
      - 'examples.md'
      - 'README.md'
      - 'ROADMAP.md'
      - 'handoff.md'
      - 'compiler/ada/README.md'
      - 'core/README.md'
      - 'devices/README.md'
      - 'compiler/tests/driver/DERIVATION.md'
      - 'docs/diagnostics.md'
      - 'docs/format.md'
      - 'docs/server.md'
      - 'docs/ir.md'
      - 'docs/targets.md'
      - 'compiler/ada/TOOLCHAIN.md'
      - 'docs/environments.md'
      - 'environments/cortex-m/README.md'
      - 'environments/native-ci/README.md'
      - 'docs/process.md'
      - 'highlight/README.md'
      - 'compiler/tests/README.md'
      - 'compiler/tests/registers.md'
      - 'compiler/tests/harness-cases/README.md'
      - 'docs/site/*.py'
      - 'highlight/landin_highlight.py'
      - 'assets/*.py'
      - 'assets/icon.svg'
      - 'assets/fonts/**'
      - 'compiler/ada/src/diagnostics/landin-diagnostics-syntactic.ads'
      - 'compiler/ada/src/diagnostics/landin-diagnostics-checking.ads'
      - 'compiler/tests/diagnostics.catalogue'
      - 'compiler/tests/fixtures/runtime/*/fixture.meta'
      - 'compiler/tests/fixtures/runtime/sensors/*.ldn'
  workflow_dispatch:

#  Only the deploy job publishes, so only it holds the pages and identity
#  tokens; the build job runs the renderer on a checked-out tree.
permissions:
  contents: read

#  One publication at a time, and never cancel one in flight: a cancelled
#  deploy can leave the site half-replaced.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FONTS_BASE: https://fsn1.your-objectstorage.com/landin/fonts

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the licensed face
        run: |
          set -eu
          dest="${RUNNER_TEMP}/landin-fonts"
          mkdir -p "$dest/monolisa"
          curl -fsS -o "$dest/README.md"            "$FONTS_BASE/README.md"
          curl -fsS -o "$dest/monolisa/LICENSE.md"  "$FONTS_BASE/monolisa/LICENSE.md"
          curl -fsS -o "$dest/monolisa/monolisa.css" "$FONTS_BASE/monolisa/monolisa.css"
          #  The stylesheet is the list of faces, so a subset added upstream
          #  arrives without editing this workflow.
          grep -oE 'url\([^)]*\)' "$dest/monolisa/monolisa.css" \
            | sed 's|url(||; s|)||; s|^/||' | sort -u \
            | while read -r face; do
                curl -fsS --create-dirs -o "$dest/monolisa/$face" \
                     "$FONTS_BASE/monolisa/$face"
              done
          echo "LANDIN_FONTS=$dest" >> "$GITHUB_ENV"

      - name: Render and verify
        run: python3 docs/site/render_html.py --from . --verify

      - name: Claim the domain
        run: echo 'www.701.dev' > docs/site/site/CNAME

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
