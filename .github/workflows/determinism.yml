#  Emission is host-neutral, or the compiler is reading something off the
#  machine it runs on.
#
#  compiler/tests/test_determinism.py states the equivalence relation two
#  compilations must agree on and checks it within one host.  A single
#  machine cannot check the host itself, so that half lives here: each host
#  emits a manifest of assembly digests for every positive fixture on every
#  target in both build modes, and the manifests have to agree.  Each fixture
#  is compiled from what its own fixture.meta names, as the harness does.
#
#  The cheap axis is the one that multiplies.  Emission needs no target
#  assembler, linker or emulator, so a host job installs the pinned
#  toolchain, builds the compiler and emits for all three targets in about
#  two minutes -- which is what makes the matrix hosts + targets rather
#  than hosts x targets.

name: determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            platform: x86_64-linux
            build: linux-amd64
          - host: macos-15
            platform: aarch64-darwin
            build: darwin-arm64
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        uses: ./.github/actions/pinned-toolchain
        with:
          platform: ${{ matrix.platform }}

      - name: Build refine
        run: ./scripts/build.sh -j4

      - name: Emit this host's manifest
        run: |
          python3 scripts/emit_manifest.py emit \
            compiler/ada/build/${{ matrix.build }}/debug/bin/refine \
            . manifest-${{ matrix.platform }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-${{ matrix.platform }}
          path: manifest-${{ matrix.platform }}.json

  agree:
    needs: manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: manifests
          merge-multiple: true
      - name: Every host emitted the same bytes
        run: |
          ls -l manifests
          python3 scripts/emit_manifest.py compare manifests/*.json
