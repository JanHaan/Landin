#  Do the links still answer?
#
#  check.py holds the two properties it can hold without a network: a
#  repository-relative name a document uses resolves, and every document is
#  reachable from README.md.  Neither says whether a URL is still there.
#
#  This runs when a document changes and once a week otherwise, because link
#  rot happens on the far side of the link and no commit here announces it.
#  It is not a gate on the compiler.

name: links

on:
  push:
    paths:
      - '**.md'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
  schedule:
    #  Mondays, early UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every link in every document
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true
