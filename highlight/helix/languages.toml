[[language]]
name = "landin"
scope = "source.landin"
file-types = ["ldn"]
roots = [".git"]
comment-tokens = ["--"]
block-comment-tokens = { start = "--(", end = ")--" }
indent = { tab-width = 4, unit = "    " }
grammar = "landin"
language-servers = ["refine"]
auto-format = false

[language-server.refine]
command = "refine"
args = ["lsp"]

[[grammar]]
name = "landin"
source = { git = "https://github.com/JanHaan/Landin", rev = "344c702b914efe9f03c0ff13e08e20e60b147b70", subpath = "highlight/tree-sitter" }
