[[language]]
name = "landin"
scope = "source.landin"
file-types = ["ldn"]
roots = [".git"]
comment-tokens = ["--"]
block-comment-tokens = { start = "--(", end = ")--" }
indent = { tab-width = 4, unit = "    " }
grammar = "landin"
language-servers = ["refine"]
auto-format = false

[language-server.refine]
command = "refine"
args = ["lsp"]

[[grammar]]
name = "landin"
source = { git = "https://github.com/JanHaan/Landin", rev = "21e34d4a87c9c08aa15c9fea4f2351d4cf18b120", subpath = "highlight/tree-sitter" }
